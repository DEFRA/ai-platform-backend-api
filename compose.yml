services:
  # floci is a replacement for localstack. It emulates AWS resources (sqs, sns, s3 etc) for local development
  # See: https://floci.io for more details
  floci:
    image: hectorvent/floci:latest-aws
    ports:
      - '4566:4566'
    env_file:
      - 'compose/aws.env'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
    volumes:
      - ./compose/floci/start.d:/etc/floci/init/start.d:ro
    networks:
      - cdp-tenant

  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6379:6379'
    networks:
      - cdp-tenant

  mongodb:
    image: mongo:7.0.28
    networks:
      - cdp-tenant
    ports:
      - '27017:27017'
    volumes:
      - ./compose/mongo:/docker-entrypoint-initdb.d:ro
      - mongodb-data:/data
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.hello().ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  ################################################################################

  ai-platform-backend-api:
    build:
      context: .
      target: development
    ports:
      - '3001:3001'
    links:
      - 'floci:floci'
      - 'mongodb:mongodb'
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_started
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 3001
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/
      # mock (the default) stages the GitOps events itself. TENANT_ORCHESTRATOR=sqs
      # runs against the topic and queues floci creates
      # (compose/floci/start.d/20-gitops-queues.sh): the messaging settings
      # below default to those and can be overridden from the host shell. The
      # GitHub App credentials have no default; sqs needs them (they are read
      # from the host shell, and left unset when it has none).
      TENANT_ORCHESTRATOR: ${TENANT_ORCHESTRATOR:-mock}
      GITOPS_COMMANDS_TOPIC_ARN: ${GITOPS_COMMANDS_TOPIC_ARN:-arn:aws:sns:eu-west-2:000000000000:aip_gitops_commands.fifo}
      GITOPS_EVENTS_QUEUE_URL: ${GITOPS_EVENTS_QUEUE_URL:-http://floci:4566/000000000000/aip_gitops_events.fifo}
      AWS_SQS_ENDPOINT: ${AWS_SQS_ENDPOINT:-http://floci:4566}
      AWS_SNS_ENDPOINT: ${AWS_SNS_ENDPOINT:-http://floci:4566}
      GITHUB_APP_ID:
      GITHUB_APP_INSTALLATION_ID:
      GITHUB_APP_PRIVATE_KEY:
    networks:
      - cdp-tenant
    volumes:
      - ./src:/home/node/src
      - ./package.json:/home/node/package.json

################################################################################

volumes:
  mongodb-data:

networks:
  cdp-tenant:
    driver: bridge
    name: cdp-tenant
