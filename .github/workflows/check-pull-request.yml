name: Check Pull Request

on:
  pull_request:
    branches:
      - main
      - minimal
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Security audit
        run: npm run security-audit

      - name: Install dependencies
        run: npm ci

      # The tests start MongoDB from a binary that mongodb-memory-server
      # downloads from fastdl.mongodb.org. That download is often reset on
      # GitHub runners and, with no retry or resume, fails every test file.
      # Fetch it here with curl, which retries and resumes, and point the tests
      # at it so nothing is downloaded during the run.
      - name: Download the MongoDB test binary
        env:
          MONGO_VERSION: 7.0.24
        run: |
          archive="mongodb-linux-x86_64-ubuntu2204-${MONGO_VERSION}"
          curl --fail --silent --show-error --location \
            --retry 10 --retry-all-errors --retry-delay 5 --continue-at - \
            --output "${RUNNER_TEMP}/mongodb.tgz" \
            "https://fastdl.mongodb.org/linux/${archive}.tgz"
          tar -xzf "${RUNNER_TEMP}/mongodb.tgz" -C "${RUNNER_TEMP}" "${archive}/bin/mongod"
          echo "MONGOMS_SYSTEM_BINARY=${RUNNER_TEMP}/${archive}/bin/mongod" >> "$GITHUB_ENV"
          echo "MONGOMS_VERSION=${MONGO_VERSION}" >> "$GITHUB_ENV"
          "${RUNNER_TEMP}/${archive}/bin/mongod" --version | head -1
      - run: |
          npm run format:check
          npm run lint
          npm run contracts:check
          npm test

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag cdp-node-backend-template .
          exit $?

      - name: SonarCloud Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@v8.4.0 #  (or check latest version on https://github.com/marketplace/actions/official-sonarqube-scan)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
