name: Check Pull Request

on:
  pull_request:
    branches:
      - main
      - minimal
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Security audit
        run: npm run security-audit

      - name: Install dependencies
        run: npm ci

      # The test setup downloads a MongoDB binary from fastdl.mongodb.org, which
      # sometimes resets the connection on GitHub runners and fails every test
      # file. Fetch it once here, with retries, so the tests find it on disk.
      - name: Download the MongoDB test binary
        run: |
          for attempt in 1 2 3 4 5 6; do
            npx vitest run src/common/helpers/uuid-v7.test.js && exit 0
            echo "MongoDB binary download attempt $attempt failed"
            sleep $((attempt * 15))
          done
          exit 1

      - run: |
          npm run format:check
          npm run lint
          npm run contracts:check
          npm test

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag cdp-node-backend-template .
          exit $?

      - name: SonarCloud Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@v8.3.0 #  (or check latest version on https://github.com/marketplace/actions/official-sonarqube-scan)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
